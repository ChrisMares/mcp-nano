      :root {
        color-scheme: dark;

        /* Mirrors the React app's `.dark` theme tokens (src/index.css) */
        --foreground: oklch(0.95 0.02 85);
        --muted-foreground: oklch(0.72 0.03 80);
        --brand-gold: oklch(0.78 0.16 75);
        --brand-gold-bright: oklch(0.9 0.15 85);
        --brand-cyan: oklch(0.85 0.13 192);
        --brand-cyan-light: oklch(0.92 0.09 192);
        --brand-surface: oklch(0.25 0.005 260);
        --brand-surface-raised: oklch(0.3 0.005 260);
        --star-dim: oklch(0.55 0.02 260);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: "Courier New", ui-monospace, monospace;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      /* ---------- starfield (scrolls behind the ship) ---------- */
      .starfield {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }

      .stars-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 200vh;
        animation: fall-stars linear infinite;

        width: 2px;
        height: 2px;
        background: transparent;

      @keyframes fall-stars {
        0% {
          transform: translateY(-100vh);
        }
        100% {
          transform: translateY(0);
        }
      }

      /* ---------- pixel-art stage ---------- */
      .stage {
        position: relative;
        width: 72px;
        height: 96px;
        z-index: 1;
      }

      .px {
        image-rendering: pixelated;
      }

      .rocket {
        position: absolute;
        left: 0;
        width: 8px;
        height: 8px;
        background: transparent;
        box-shadow:
          32px 0px 0 var(--foreground),
          24px 8px 0 var(--foreground),
          32px 8px 0 var(--foreground),
          40px 8px 0 var(--foreground),
          24px 16px 0 var(--foreground),
          32px 16px 0 var(--foreground),
          40px 16px 0 var(--foreground),
          16px 24px 0 var(--foreground),
          24px 24px 0 var(--foreground),
          32px 24px 0 var(--foreground),
          40px 24px 0 var(--foreground),
          48px 24px 0 var(--foreground),
          16px 32px 0 var(--foreground),
          24px 32px 0 var(--foreground),
          32px 32px 0 var(--foreground),
          40px 32px 0 var(--foreground),
          48px 32px 0 var(--foreground),
          16px 40px 0 var(--foreground),
          24px 40px 0 var(--foreground),
          40px 40px 0 var(--foreground),
          48px 40px 0 var(--foreground),
          16px 48px 0 var(--foreground),
          24px 48px 0 var(--foreground),
          40px 48px 0 var(--foreground),
          48px 48px 0 var(--foreground),
          16px 56px 0 var(--foreground),
          24px 56px 0 var(--foreground),
          32px 56px 0 var(--foreground),
          40px 56px 0 var(--foreground),
          48px 56px 0 var(--foreground),
          32px 40px 0 var(--brand-cyan),
          32px 48px 0 var(--brand-cyan),
          8px 64px 0 var(--brand-gold),
          16px 64px 0 var(--brand-gold),
          48px 64px 0 var(--brand-gold),
          56px 64px 0 var(--brand-gold),
          0px 72px 0 var(--brand-gold),
          8px 72px 0 var(--brand-gold),
          56px 72px 0 var(--brand-gold),
          64px 72px 0 var(--brand-gold),
          24px 64px 0 var(--muted-foreground),
          32px 64px 0 var(--muted-foreground),
          40px 64px 0 var(--muted-foreground),
          16px 72px 0 var(--muted-foreground),
          24px 72px 0 var(--muted-foreground),
          32px 72px 0 var(--muted-foreground),
          40px 72px 0 var(--muted-foreground),
          48px 72px 0 var(--muted-foreground),
          16px 80px 0 var(--muted-foreground),
          24px 80px 0 var(--muted-foreground),
          32px 80px 0 var(--muted-foreground),
          40px 80px 0 var(--muted-foreground),
          48px 80px 0 var(--muted-foreground);
        animation: hover 1.6s ease-in-out infinite;
      }

      .flame {
        position: absolute;
        left: 0;
        top: 88px;
        width: 8px;
        height: 8px;
        background: transparent;
        animation:
          hover 1.6s ease-in-out infinite,
          flicker 0.22s steps(1) infinite;
      }

      @keyframes hover {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes flicker {
        0% {
          box-shadow:
            24px 0px 0 var(--brand-gold-bright),
            32px 0px 0 var(--brand-gold),
            24px 8px 0 var(--brand-gold),
            32px 8px 0 var(--brand-gold);
        }
        50% {
          box-shadow:
            16px 0px 0 var(--brand-gold-bright),
            24px 0px 0 var(--brand-gold-bright),
            32px 0px 0 var(--brand-gold-bright),
            40px 0px 0 var(--brand-gold-bright),
            24px 8px 0 var(--brand-gold-bright),
            32px 8px 0 var(--brand-gold-bright),
            16px 8px 0 var(--brand-gold),
            40px 8px 0 var(--brand-gold),
            24px 16px 0 var(--brand-gold),
            32px 16px 0 var(--brand-gold);
        }
        100% {
          box-shadow:
            24px 0px 0 var(--brand-gold-bright),
            32px 0px 0 var(--brand-gold),
            24px 8px 0 var(--brand-gold),
            32px 8px 0 var(--brand-gold);
        }
      }

      /* exhaust trail pixels drifting down + fading */
      .exhaust {
        position: absolute;
        left: 30px;
        top: 96px;
        width: 6px;
        height: 6px;
        background: var(--brand-gold);
        image-rendering: pixelated;
        animation: puff 1.1s linear infinite;
        opacity: 0;
        z-index: 1;
      }
      .exhaust:nth-child(3) {
        left: 22px;
        animation-delay: 0.28s;
      }
      .exhaust:nth-child(4) {
        left: 40px;
        animation-delay: 0.55s;
      }
      .exhaust:nth-child(5) {
        left: 30px;
        animation-delay: 0.82s;
      }

      @keyframes puff {
        0% {
          opacity: 0.9;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(22px) scale(0.4);
        }
      }

      /* ---------- terminal loading text ---------- */
      .loading {
        position: relative;
        z-index: 1;
        font-size: 15px;
        letter-spacing: 3px;
        color: var(--brand-cyan);
        text-transform: uppercase;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: baseline;
      }

      .dots {
        display: inline-block;
        width: 9ch;
        text-align: left;
      }

      .dots::after {
        content: ".";
        animation: dots-cycle 3.5s steps(1) infinite;
      }

      @keyframes dots-cycle {
        0% {
          content: ".";
        }
        7.14% {
          content: "..";
        }
        14.29% {
          content: "...";
        }
        21.43% {
          content: "....";
        }
        28.57% {
          content: ".....";
        }
        35.71% {
          content: "......";
        }
        42.86% {
          content: ".......";
        }
        50% {
          content: "........";
        }
        57.14% {
          content: ".......";
        }
        64.29% {
          content: "......";
        }
        71.43% {
          content: ".....";
        }
        78.57% {
          content: "....";
        }
        85.71% {
          content: "...";
        }
        92.86% {
          content: "..";
        }
        100% {
          content: ".";
        }
      }
    </style>
  </head>
  <body>
    <div class="starfield">
      <div class="stars-layer stars-far"></div>
      <div class="stars-layer stars-near"></div>
    </div>
    <div class="stage px">
      <div class="rocket"></div>
      <div class="flame"></div>
      <div class="exhaust"></div>
      <div class="exhaust"></div>
      <div class="exhaust"></div>
      <div class="exhaust"></div>
    </div>
    <div class="loading">
      <span>LOADING</span><span class="dots"></span>
    </div>
